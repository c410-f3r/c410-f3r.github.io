{% extends "index.html" %}

{% block content %}
<h4 class="has-text-centered is-4 ribbon title">Tag: {{ term.name }}</h4>

<ul>
    {% for page in term.pages %}
    <li>
        <strong><a href="{{ page.permalink }}">{{ page.title }}</a></strong>
        <div>{{ page.description | safe }}</div>
    </li>
    {% endfor %}
</ul>
{% endblock content %}
