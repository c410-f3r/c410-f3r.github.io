{% extends "index.html" %}

{% block content %}
<h4 class="has-text-centered is-4 ribbon title">Tags</h4>

<ul>
    {% for term in terms %}
    <li>
        <a href="{{ term.permalink }}"><strong>{{ term.name }}</strong></a> ({{ term.pages | length }} posts)
    </li>
    {% endfor %}
</ul>
{% endblock content %}
